# Project-wide Gradle settings
# 纯离线 App，不使用任何外部网络资源（依赖通过 Gradle 一次性下载到本地缓存后离线可用）

# JVM 参数：Compose 编译比较吃内存
org.gradle.jvmargs=-Xmx4g -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=false

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin
kotlin.code.style=official
kotlin.incremental=true

# KSP（Room 推荐使用 KSP 替代 kapt，速度更快）
ksp.useKSP2=false

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
android.defaults.buildfeatures.resvalues=true
android.sdk.defaultTargetSdkToCompileSdkIfUnset=false
android.enableAppCompileTimeRClass=false
android.usesSdkInManifest.disallowed=false
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
android.r8.optimizedResourceShrinking=false
android.builtInKotlin=false
android.newDsl=false

# Baseline Profile：让 AGP 在构建时生成并把 baseline.prof 打进 APK，
# 配合 AndroidManifest 里的 ProfileInstallReceiver，设备侧才能真正装上预编译 profile。
# 定向到业务热路径的 profile 仍需在真机上采集（见交付说明）。
android.experimental.enableArtProfiles=true